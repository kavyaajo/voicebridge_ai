          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /audio-records/:
    get:
      operationId: audio_records_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - audio-records
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudioRecordList'
          description: ''
    post:
      operationId: audio_records_create
      tags:
      - audio-records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioRecord'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRecord'
          description: ''
  /audio-records/{id}/:
    get:
      operationId: audio_records_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audio record.
        required: true
      tags:
      - audio-records
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRecord'
          description: ''
    put:
      operationId: audio_records_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audio record.
        required: true
      tags:
      - audio-records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioRecord'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRecord'
          description: ''
    patch:
      operationId: audio_records_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audio record.
        required: true
      tags:
      - audio-records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAudioRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAudioRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAudioRecord'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRecord'
          description: ''
    delete:
      operationId: audio_records_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audio record.
        required: true
      tags:
      - audio-records
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /audio-records/{id}/get_audio_file/:
    get:
      operationId: audio_records_get_audio_file_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audio record.
        required: true
      tags:
      - audio-records
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRecord'
          description: ''
components:
  schemas:
    AudioRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        audio_file:
          type: string
          format: uri
        transcript:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
      required:
      - audio_file
      - created_at
      - id
      - transcript
      - user
    PaginatedAudioRecordList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AudioRecord'
    PatchedAudioRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        audio_file:
          type: string
          format: uri
        transcript:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
